<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materias · Gestión de Alumnos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-body">

    <nav class="navbar">
        <div class="navbar-brand">
            <img src="/assets/logo-icon.png" alt="" class="navbar-logo">
            <span>Gestión de Alumnos</span>
        </div>
        <div class="navbar-menu">
            <a href="/pages/index.html" class="navbar-link">Alumnos</a>
            <a href="/pages/administradores.html" class="navbar-link">Administradores</a>
            <a href="/pages/periodos.html" class="navbar-link">Periodos</a> 
            <a href="/pages/materias.html" class="navbar-link is-active">Materias</a>
            <a href="/pages/anuncios.html" class="navbar-link">Anuncios</a>
            <a href="/pages/tramites.html" class="navbar-link">Trámites</a>
            <span id="navUserGreeting" class="navbar-greeting"></span>
            <button type="button" id="btnLogout" class="navbar-logout">Cerrar sesión</button>
        </div>
    </nav>

    <main class="page-content">

        <div class="login-container">

            <div class="login-header">
                <h2>Materias</h2>
                <p>Registrar una nueva materia</p>
            </div>

            <form id="formMateria">

                <div class="input-group">
                    <label for="nombre_materia">Nombre de la materia</label>
                    <input
                        type="text"
                        id="nombre_materia"
                        placeholder="Ej. Programación Web"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="creditos">Créditos</label>
                    <input
                        type="text"
                        id="creditos"
                        placeholder="Ej. 8"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">
                    Guardar
                </button>

                <div id="mensajeError" class="mensaje-error">
                    Hubo un error al procesar la solicitud, intente de nuevo
                </div>

            </form>
        </div>

        <div class="lista-section">

            <div class="lista-header">
                <h2 class="lista-titulo">Lista de Materias</h2>

                <div class="buscador">
                    <span class="buscador-icono">🔍</span>
                    <input
                        type="text"
                        id="buscarIdMateria"
                        class="buscador-input"
                        placeholder="Buscar por ID..."
                        inputmode="numeric"
                        autocomplete="off"
                    >
                    <button type="button" id="btnLimpiarBusquedaMateria" class="buscador-limpiar" hidden aria-label="Limpiar búsqueda">✕</button>
                </div>
            </div>

            <div id="listaMaterias"></div>

            <p id="sinResultadosBusquedaMateria" class="sin-resultados" hidden>
                No se encontró ninguna materia con ese ID.
            </p>

        </div>

    </main>

    <script src="/js/common.js"></script>
    <script src="/js/materias.js"></script>

</body>
</html>
