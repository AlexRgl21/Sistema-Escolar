<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodos · Gestión de Alumnos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-body">

    <nav class="navbar">
        <div class="navbar-brand">
            <img src="/assets/logo-icon.png" alt="" class="navbar-logo">
            <span>Gestión de Alumnos</span>
        </div>
        <div class="navbar-menu">
            <a href="/pages/index.html" class="navbar-link">Alumnos</a>
            <a href="/pages/administradores.html" class="navbar-link">Administradores</a>
            <a href="/pages/periodos.html" class="navbar-link is-active">Periodos</a> 
            <a href="/pages/materias.html" class="navbar-link">Materias</a>
            <a href="/pages/anuncios.html" class="navbar-link">Anuncios</a>
            <a href="/pages/tramites.html" class="navbar-link">Trámites</a>
            <span id="navUserGreeting" class="navbar-greeting"></span>
            <button type="button" id="btnLogout" class="navbar-logout">Cerrar sesión</button>
        </div>
    </nav>

    <main class="page-content">

        <div style="text-align: center; margin-bottom: 20px; padding-top: 20px;">
            <button type="button" id="btnAñadir" class="btn-login" style="width: auto; padding: 10px 30px;">
                + Añadir nuevo periodo
            </button>
        </div>
        
        <div id="contenedorFormulario" class="login-container" style="display: none;">

            <div class="login-header">
                <h2>Periodos</h2>
                <p>Registrar un nuevo periodo</p>
            </div>

            <form id="formPeriodo">

                <div class="input-group">
                    <label for="nombre_periodo">Nombre del periodo</label>
                    <input
                        type="text"
                        id="nombre_periodo"
                        placeholder="Ej. Enero - Junio 2026"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="fecha_inicio">Fecha de inicio</label>
                    <input
                        type="date"
                        id="fecha_inicio"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="fecha_fin">Fecha de fin</label>
                    <input
                        type="date"
                        id="fecha_fin"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="estatus">Estatus</label>
                    <select id="estatus" required>
                        <option value="" disabled selected>Selecciona un estatus</option>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>

                <button type="submit" class="btn-login">
                    Guardar
                </button>

                <div id="mensajeError" class="mensaje-error" style="display: none;">
                    Hubo un error al procesar la solicitud, intente de nuevo
                </div>

            </form>
        </div>

        <div class="lista-section">

            <div class="lista-header">
                <h2 class="lista-titulo">Lista de Periodos</h2>

                <div class="buscador">
                    <span class="buscador-icono">🔍</span>
                    <input
                        type="text"
                        id="buscarIdPeriodo"
                        class="buscador-input"
                        placeholder="Buscar por ID..."
                        inputmode="numeric"
                        autocomplete="off"
                    >
                    <button type="button" id="btnLimpiarBusquedaPeriodo" class="buscador-limpiar" hidden aria-label="Limpiar búsqueda">✕</button>
                </div>
            </div>

            <div id="listaPeriodos"></div>

            <p id="sinResultadosBusquedaPeriodo" class="sin-resultados" hidden>
                No se encontró ningún periodo con ese ID.
            </p>

        </div>

    </main>

    <script src="/js/common.js"></script>
    <script src="/js/periodos.js"></script>

</body>
</html>
