<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Materia a Periodo · Gestión de Alumnos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

    <nav class="navbar">
        <div class="navbar-brand">
            <img src="logo-icon.png" alt="" class="navbar-logo">
            <span>Gestión de Alumnos</span>
        </div>
        <div class="navbar-menu">
            <a href="index.html" class="navbar-link">Alumnos</a>
            <a href="administradores.html" class="navbar-link">Administradores</a>
            <a href="periodos.html" class="navbar-link is-active">Periodos</a>
            <a href="materias.html" class="navbar-link">Materias</a>
            <a href="anuncios.html" class="navbar-link">Anuncios</a>
            <a href="tramites.html" class="navbar-link">Trámites</a>
            <span id="navUserGreeting" class="navbar-greeting"></span>
            <button type="button" id="btnLogout" class="navbar-logout">Cerrar sesión</button>
        </div>
    </nav>

    <main class="page-content">

        <div class="login-container">

            <div class="login-header">
                <h2>Agregar materia al periodo</h2>
                <p id="tituloPeriodoTexto">Cargando información del periodo…</p>
            </div>

            <form id="formInscripcion">

                <div class="input-group">
                    <label for="id_alumno">Alumno</label>
                    <select id="id_alumno" required>
                        <option value="" disabled selected>Selecciona un alumno</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="id_materia">Materia</label>
                    <select id="id_materia" required>
                        <option value="" disabled selected>Selecciona una materia</option>
                    </select>
                </div>

                <button type="submit" class="btn-login">
                    Agregar al periodo
                </button>

                <div id="mensajeExito" class="mensaje-exito"></div>

                <div id="mensajeError" class="mensaje-error">
                    Hubo un error al procesar la solicitud, intente de nuevo
                </div>

            </form>

            <a id="volverPeriodo" href="periodos.html" class="volver-link">← Volver al periodo</a>

        </div>

    </main>

    <script src="common.js"></script>
    <script src="inscribir-materia.js"></script>

</body>
</html>
