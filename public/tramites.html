<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trámites · Gestión de Alumnos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

    <nav class="navbar">
        <div class="navbar-brand">
            <img src="logo-icon.png" alt="" class="navbar-logo">
            <span>Gestión de Alumnos</span>
        </div>
        <div class="navbar-menu">
            <a href="index.html" class="navbar-link">Alumnos</a>
            <a href="administradores.html" class="navbar-link">Administradores</a>
            <a href="periodos.html" class="navbar-link">Periodos</a>
            <a href="materias.html" class="navbar-link">Materias</a>
            <a href="anuncios.html" class="navbar-link">Anuncios</a>
            <a href="tramites.html" class="navbar-link is-active">Trámites</a>
            <span id="navUserGreeting" class="navbar-greeting"></span>
            <button type="button" id="btnLogout" class="navbar-logout">Cerrar sesión</button>
        </div>
    </nav>

    <main class="page-content">

        <div class="lista-section lista-section-ancha">

            <div class="lista-header">
                <h2 class="lista-titulo">Trámites de alumnos</h2>

                <div class="buscador">
                    <span class="buscador-icono">🔍</span>
                    <input
                        type="text"
                        id="buscarIdTramite"
                        class="buscador-input"
                        placeholder="Buscar por ID..."
                        inputmode="numeric"
                        autocomplete="off"
                    >
                    <button type="button" id="btnLimpiarBusquedaTramite" class="buscador-limpiar" hidden aria-label="Limpiar búsqueda">✕</button>
                </div>
            </div>

            <p class="datos-solo-lectura">Los trámites pendientes se muestran primero. Da clic en uno para revisarlo y responder.</p>

            <div id="listaTramites"></div>

            <p id="sinResultadosBusquedaTramite" class="sin-resultados" hidden>
                No se encontró ningún trámite con ese ID.
            </p>

        </div>

    </main>

    <script src="common.js"></script>
    <script src="tramites.js"></script>

</body>
</html>
