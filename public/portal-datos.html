<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Datos · Gestión de Alumnos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

    <nav class="navbar">
        <div class="navbar-brand">
            <img src="logo-icon.png" alt="" class="navbar-logo">
            <span>Portal del Alumno</span>
        </div>
        <div class="navbar-menu">
            <a href="portal-alumno.html" class="navbar-link">Inicio</a>
            <a href="portal-materias.html" class="navbar-link">Mis materias</a>
            <a href="portal-datos.html" class="navbar-link is-active">Mis datos</a>
            <a href="portal-anuncios.html" class="navbar-link">Anuncios</a>
            <a href="portal-tramites.html" class="navbar-link">Trámites</a>
            <span id="navUserGreeting" class="navbar-greeting"></span>
            <button type="button" id="btnLogout" class="navbar-logout">Cerrar sesión</button>
        </div>
    </nav>

    <main class="page-content">

        <div class="detalle-card">

            <h2 class="detalle-nombre">Mis datos</h2>
            <p class="datos-solo-lectura">
                Puedes actualizar tu nombre, correo y contraseña. Tu estatus y tu rol los administra la escuela y no se pueden cambiar desde aquí.
            </p>

            <form id="formMisDatos">

                <div class="input-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="input-group">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" required>
                </div>

                <div class="input-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" required>
                </div>

                <div class="input-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="text" id="contrasena" required>
                </div>

                <div class="input-group">
                    <label for="estatusTexto">Estatus</label>
                    <input type="text" id="estatusTexto" readonly disabled>
                    <input type="hidden" id="estatus">
                </div>

                <div class="input-group">
                    <label for="rolTexto">Rol</label>
                    <input type="text" id="rolTexto" value="Estudiante" readonly disabled>
                    <input type="hidden" id="id_rol" value="1">
                </div>

                <div class="form-acciones">
                    <button type="submit" class="btn-guardar">Guardar cambios</button>
                </div>

                <div id="mensajeGuardado" class="mensaje-exito"></div>
                <div id="mensajeError" class="mensaje-error"></div>

            </form>

        </div>

    </main>

    <script src="common.js"></script>
    <script src="portal-common.js"></script>
    <script src="portal-datos.js"></script>

</body>
</html>
