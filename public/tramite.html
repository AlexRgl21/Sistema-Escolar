<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Trámite · Gestión de Alumnos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

    <nav class="navbar">
        <div class="navbar-brand">
            <img src="logo-icon.png" alt="" class="navbar-logo">
            <span>Gestión de Alumnos</span>
        </div>
        <div class="navbar-menu">
            <a href="index.html" class="navbar-link">Alumnos</a>
            <a href="administradores.html" class="navbar-link">Administradores</a>
            <a href="periodos.html" class="navbar-link">Periodos</a>
            <a href="materias.html" class="navbar-link">Materias</a>
            <a href="anuncios.html" class="navbar-link">Anuncios</a>
            <a href="tramites.html" class="navbar-link is-active">Trámites</a>
            <span id="navUserGreeting" class="navbar-greeting"></span>
            <button type="button" id="btnLogout" class="navbar-logout">Cerrar sesión</button>
        </div>
    </nav>

    <main class="page-content">

        <div class="detalle-card">

            <a href="tramites.html" class="volver-link">← Volver a la lista</a>

            <div id="estadoCarga" class="detalle-cargando">Cargando información del trámite…</div>

            <div id="estadoNoEncontrado" class="detalle-error" hidden>
                No se encontró ningún trámite con ese ID.
            </div>

            <div id="contenidoTramite" hidden>

                <p class="detalle-id">ID de trámite: <span id="idTramiteTexto"></span></p>
                <h2 id="tipoTramiteTexto" class="detalle-nombre"></h2>
                <p class="detalle-correo" id="metaTramite"></p>
                <p class="detalle-correo">
                    <span id="badgeEstatusTramite" class="badge"></span>
                </p>

                <h3 class="detalle-subtitulo">Descripción del alumno</h3>
                <p id="descripcionTramite" class="datos-solo-lectura"></p>

                <h3 class="detalle-subtitulo">Responder trámite</h3>

                <form id="formResponderTramite">

                    <div class="input-group">
                        <label for="editEstatus">Estatus</label>
                        <select id="editEstatus" required>
                            <option value="Pendiente">Pendiente</option>
                            <option value="En proceso">En proceso</option>
                            <option value="Resuelto">Resuelto</option>
                            <option value="Rechazado">Rechazado</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="editRespuesta">Respuesta para el alumno</label>
                        <textarea id="editRespuesta" rows="4" placeholder="Ej. Tu constancia está lista, puedes recogerla en control escolar."></textarea>
                    </div>

                    <div class="form-acciones">
                        <button type="submit" class="btn-guardar">Guardar respuesta</button>
                    </div>

                    <div id="mensajeGuardado" class="mensaje-exito"></div>
                    <div id="mensajeErrorEdit" class="mensaje-error"></div>

                </form>

            </div>

        </div>

    </main>

    <script src="common.js"></script>
    <script src="tramite.js"></script>

</body>
</html>
